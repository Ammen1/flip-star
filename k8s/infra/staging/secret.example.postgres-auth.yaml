# TEMPLATE ONLY -- not referenced by kustomization.yaml, never applied from git.
#
# Same convention as k8s/base/secret.example.yaml: secrets are created
# out-of-band, once, per namespace. k8s-validate.yml fails the build if the
# rendered output of any kustomization contains `kind: Secret`, which is what
# stops this file being wired in by accident.
#
# Create it with (values from your password manager, never from this file):
#
#   kubectl -n flipstar-staging create secret generic postgres-auth \
#     --from-literal=POSTGRES_DB=flipstar \
#     --from-literal=POSTGRES_USER=flipstar \
#     --from-literal=POSTGRES_PASSWORD='<generate a fresh one>'
#
# TWO TRAPS, both of which produce a confusing failure hours later:
#
# 1. POSTGRES_PASSWORD is only consulted by initdb, i.e. the FIRST time the
#    volume is empty. Changing this Secret afterwards does NOT change the
#    database password -- you must ALTER USER inside Postgres as well.
#
# 2. This value must equal DB_PASSWORD at flipstar/backend/staging in Vault.
#    They are two independent copies of one fact, and nothing checks that they
#    agree. If the backend cannot authenticate to a healthy Postgres, this is
#    almost always why.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: flipstar-staging
type: Opaque
stringData:
  POSTGRES_DB: flipstar
  POSTGRES_USER: flipstar
  POSTGRES_PASSWORD: REPLACE-ME-generate-a-fresh-value
