# Backend API (Daphne/ASGI -- serves HTTP and WebSocket traffic via Django
# Channels; a WSGI server would silently drop the WebSocket support, see
# Dockerfile). Image tag is set per-deploy by `kustomize edit set
# image` in CI -- see .github/workflows/backend-cd.yml -- never `latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipstar-backend
  labels:
    app.kubernetes.io/name: flipstar-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: flipstar
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: flipstar-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flipstar-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: flipstar
    spec:
      serviceAccountName: flipstar-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spreads pods across nodes on a best-effort basis; not a hard
      # requirement since small clusters may only have one node available.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: flipstar-backend
                    app.kubernetes.io/component: api
      containers:
        - name: backend
          image: ghcr.io/skykin-technologies/flip-star-backend:__REPLACED_BY_KUSTOMIZE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flipstar-backend-config
            - secretRef:
                name: flipstar-backend-vault-approle
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /api/v1/health/ deliberately does not touch the database (see
          # api/urls.py::health_check) so a database blip doesn't cause a
          # restart loop. NOTE: this is the corrected path -- both
          # Dockerfile's HEALTHCHECK and docker-compose.yml's backend
          # healthcheck currently point at /api/health/ (missing /v1/), which
          # 404s; flagged separately, not fixed here since this k8s tree owns
          # its own probe definitions independently of those two files.
          startupProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
