# Deliberately NOT listed in k8s/base/kustomization.yaml, for the same reason
# as base/web: that base feeds production too. Each overlay opts in by
# referencing ../../base/dashboard.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: flipstar
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/ammen1/flipstar-dashboard
    newTag: unset-set-by-overlay
