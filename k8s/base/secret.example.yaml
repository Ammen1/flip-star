# TEMPLATE ONLY -- not a Kustomize resource (not listed in any kustomization.yaml
# in this tree) and never applied by Argo CD. Copy this, fill in real values out
# of band, and apply it directly with kubectl -- never commit the filled-in
# version to git.
#
# This is the ONE bootstrap credential docs/secrets.md calls out
# under "The bootstrap problem": with Vault holding every real application
# secret, this AppRole role_id/secret_id pair is the only thing that still
# has to reach the container some other way. Every other secret (SECRET_KEY,
# DB_PASSWORD, Telebirr/Onevas credentials, VAPID keys, ...) is fetched from
# Vault by infrastructure/secrets/provider.py at process start and never
# appears in Kubernetes at all.
#
# Create it per namespace, e.g.:
#   kubectl create secret generic flipstar-backend-vault-approle \
#     --namespace flipstar-staging \
#     --from-literal=VAULT_ROLE_ID='<role_id>' \
#     --from-literal=VAULT_SECRET_ID='<secret_id>'
#
# Better than a hand-run kubectl command long-term: a response-wrapped
# secret_id issued at deploy time (see secrets.md, "The bootstrap problem",
# option 1) or migrating to Vault's Kubernetes auth method, which lets the
# pod authenticate with its own ServiceAccount token and removes this Secret
# entirely. Both are follow-up work, not implemented here -- see
# docs/deployment.md in this k8s/ tree.
apiVersion: v1
kind: Secret
metadata:
  name: flipstar-backend-vault-approle
  labels:
    app.kubernetes.io/name: flipstar-backend
    app.kubernetes.io/part-of: flipstar
type: Opaque
stringData:
  VAULT_ROLE_ID: "REPLACE-ME"
  VAULT_SECRET_ID: "REPLACE-ME"
