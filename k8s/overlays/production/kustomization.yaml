apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flipstar-production

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - hpa.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: true

patches:
  - path: configmap-patch.yaml
  - path: replicas-patch.yaml
  - path: resources-patch.yaml

# CI updates these two lines via `kustomize edit set image` after a
# successful build on the branch/tag mapped to production -- see
# .github/workflows/backend-cd.yml. The tag is always a commit SHA, never
# `latest`. Argo CD's production Application (argocd/application-
# production.yaml) uses manual sync -- see that file for why -- so a change
# here needs an explicit "Sync" in the Argo CD UI/CLI, not just a commit.
images:
  - name: ghcr.io/skykin-technologies/flip-star-backend
    newTag: "0000000000000000000000000000000000000000"
  - name: ghcr.io/skykin-technologies/flip-star-backend-celery
    newTag: "0000000000000000000000000000000000000000"
