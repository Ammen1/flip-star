# Production only -- staging's traffic doesn't justify autoscaling.
# minReplicas matches replicas-patch.yaml's baseline of 3.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flipstar-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flipstar-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
