# Slightly higher resource floor than the base default for production load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipstar-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipstar-celery-worker
spec:
  template:
    spec:
      containers:
        - name: celery-worker
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi
