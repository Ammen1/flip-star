# Strategic-merge patch onto k8s/base/configmap.yaml -- only the keys that
# differ for staging. DB_HOST/REDIS_HOST are placeholders: point them at
# your managed Postgres/Redis (or an in-cluster Service such as
# `postgres.flipstar-staging.svc.cluster.local` if you're running them in
# the cluster) before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flipstar-backend-config
data:
  DB_HOST: "postgres.flipstar-staging.svc.cluster.local"
  REDIS_HOST: "redis.flipstar-staging.svc.cluster.local"
  CORS_ALLOWED_ORIGINS: "https://uat.flipstar.et"
  CSRF_TRUSTED_ORIGINS: "https://uat.flipstar.et"
  BACKEND_URL: "https://uat.flipstar.et"
  LOG_LEVEL: "DEBUG"
  VAULT_ADDR: "https://vault.internal:8200"
  VAULT_SECRET_PATH: "flipstar/backend/staging"
