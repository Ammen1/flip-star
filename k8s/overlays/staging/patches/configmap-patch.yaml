# Strategic-merge patch onto k8s/base/configmap.yaml -- only the keys that
# differ for staging.
#
# DB_HOST/REDIS_HOST/VAULT_ADDR are the in-cluster Services deployed on the
# sky-staging-server k3s node (namespace flipstar-staging), verified reachable
# from a pod there. VAULT_ADDR is http, not https: the staging Vault listener
# runs with tls_disable = 1. Production must not copy that -- it needs a real
# TLS listener and an https:// address here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flipstar-backend-config
data:
  # 172.16.170.2 is this node's address on the IPsec tunnel to TIMWE
  # (enp4s5). Their Master Aggregator POSTs to https://172.16.170.2/... so the
  # Host header is that bare IP; without it here Django answers 400
  # DisallowedHost after the ingress has already routed correctly, which looks
  # like an application fault rather than a config gap.
  # 10.0.0.93 is this node's VPN-side address (enp4s3). Telebirr posts payment
  # callbacks straight to it, so the Host header is a bare IP -- without it
  # here Django answers 400 DisallowedHost with an HTML page, before the
  # webhook view ever runs. That is indistinguishable from a parse failure
  # in the logs, which is how it went unnoticed.
  # partner-webserver679.phinfra.local:7890 is TIMWE's infrastructure probing
  # the backend (it also hits /api/v1/timwe/sync-order-relation); without it
  # here Django answers 400 DisallowedHost and logs an ERROR for every probe.
  ALLOWED_HOSTS: "api.uat.flipstar.et,uat.flipstar.et,flipstar.et,172.16.170.2,10.0.0.93,partner-webserver679.phinfra.local"

  # The pod CIDR, so X-Forwarded-For from ingress-nginx is honoured.
  # common/security/client_ip.py only trusts that header when the immediate
  # peer is a proxy we control, and it defaults to loopback only -- which is
  # never true in Kubernetes, where the peer is the ingress pod on 10.42.x.x.
  # Left unset, get_client_ip() returns the ingress pod's own address, so
  # TIMWE_ALLOWED_IPS would reject every genuine request from the MA, and
  # IP-based rate limiting and audit logging would attribute all traffic to
  # one internal address.
  TRUSTED_PROXY_IPS: "10.42.0.0/16"

  # Telebirr calls this back when a USSD subscription payment completes.
  #
  # It was unset, and telebirr/direct_debit.py falls back
  #   result_url or TELEBIRR_USSD_RESULT_URL or TELEBIRR_RESULT_URL
  # so every subscription payment was handed the COIN PURCHASE callback URL.
  # That handler looks up a CoinTransaction by conversation id, finds none for
  # a subscription, and drops it -- leaving the plan pending forever. The
  # status endpoint only reads the local row, so nothing self-heals: 8 of 8
  # telebirr subscriptions were stuck pending, with the customer already
  # charged.
  #
  # Host and port mirror TELEBIRR_USSD_RESULT_URL, which is the one callback
  # Telebirr is known to reach; only the path differs.
  #
  # Lives here rather than in Vault because it is a URL, not a secret, and
  # VAULT_PRECEDENCE defaults to 'env' so this value wins either way.
  # Both callbacks moved off http://uat.flipstar.et:6082 onto the ingress.
  #
  # Nothing has listened on 6082 since the namespace rebuild: `ss -lntp` shows
  # no process, no NodePort maps to it, and no Telebirr USSD payment -- coin or
  # subscription -- has confirmed since Aug 29 22:37, the last success before
  # the rebuild. 29 subscriptions and 25 coin purchases are stuck pending
  # because the confirmations have nowhere to land.
  #
  # api.uat.flipstar.et:443 is the ingress every other request already uses, so
  # it is reachable and survives cluster rebuilds. The open question is whether
  # Telebirr's client accepts our TLS certificate, which is still the
  # Kubernetes default -- if it refuses, that is why plain HTTP on a custom
  # port was chosen originally, and the certificate becomes a payment blocker.
  # Telebirr reaches us over the VPN, not the internet. Their gateway is
  # 10.180.70.177 and their own request capture echoes
  # ResultURL=https://10.0.0.93:443/api/webhooks/... -- 10.0.0.93 is this
  # node's address on enp4s3, the VPN-side interface, and the ingress
  # LoadBalancer already serves 80/443 there.
  #
  # The previous value, http://uat.flipstar.et:6082/, was wrong three ways:
  # that hostname resolves to a PUBLIC address (196.189.236.140) their network
  # has no route to, nothing has listened on 6082 since the 29 Aug rebuild,
  # and SECURE_SSL_REDIRECT turns any plain-HTTP callback into a 301 that
  # drops the POST body.
  #
  # Unversioned /api/webhooks/ matches what Telebirr has mapped; config/urls.py
  # serves the API at both /api/ and /api/v1/.
  TELEBIRR_USSD_RESULT_URL: "http://uat.flipstar.et:6082/api/webhooks/telebirrUssdPurchase/"
  # Same address as the coin callback, deliberately. Telebirr registers ONE
  # Result Address per merchant and ignores the ResultURL we send on USSD
  # pushes, so every confirmation -- coin and subscription alike -- arrives
  # at telebirrUssdPurchase. api/views/wallet.py routes on the payload:
  # no matching CoinTransaction means it looks for a SubscriptionPayment.
  # Pointing this at a distinct path would just be a URL nothing ever calls.
  TELEBIRR_SUBSCRIPTION_USSD_RESULT_URL: "http://uat.flipstar.et:6082/api/webhooks/telebirrUssdPurchase/"

  # B2C payout callbacks. The B2C ResultURL is read from each request, unlike
  # the USSD flows where Telebirr uses a Result Address registered against the
  # merchant and ignores what we send.
  #
  # Ethio Telecom has stated this must be the uat.flipstar.et:6082 address
  # below -- they will not call an arbitrary one, so the value is theirs to
  # dictate and not ours to choose.
  #
  # This reverses an earlier change. That change moved the URL to
  # https://10.0.0.93:443 on the reasoning that uat.flipstar.et:6082 was a
  # closed port their VPN could not route to. The observation was sound --
  # payout confirmations were being lost, and withdrawals #37 and #41 have sat
  # in 'processing' since September -- but the remedy was not: repointing the
  # URL at an address Telebirr does not call cannot make a callback arrive.
  #
  # So the address stays as Telebirr requires, and REACHABILITY IS THE OPEN
  # WORK: port 6082 on uat.flipstar.et must accept connections from Telebirr's
  # egress, and requests must route through to this Service. Until that is
  # true the callback still will not land, and a payout will still be
  # confirmed by nothing.
  #
  # Note it is http, not https. Telebirr's requirement, not a choice here: the
  # result envelope therefore crosses the network in clear text, carrying a
  # TransactionID and the payee MSISDN.
  TELEBIRR_B2C_RESULT_URL: "http://uat.flipstar.et:6082/api/v1/webhooks/telebirrB2C/"

  # The merchant short code. This account has one code for every direction
  # (553559); telebirr issues per-direction codes to some merchants, which
  # is why these remain separate settings. They shared a single setting
  # until it was split, and TELEBIRR_SHORTCODE was never set, so every
  # payout went out with an empty <req:ShortCode> and was refused with a
  # generic error -- which is what the failed withdrawals were.
  #
  # B2C was 53906, USSD and C2B were 53599.
  #
  # The ORG operator moved with the short code after all: Ethio Telecom
  # issued one identity (IdentifierType 12, Identifier 227833) for both
  # cashout and USSD push, replacing 5359901 and 5359902. Operator ids,
  # credentials and SOAP URLs are NOT set here -- they live in Vault, and
  # VAULT_PRECEDENCE is 'env', so setting any of them here would silently
  # override Vault.
  TELEBIRR_SHORTCODE: "553559"
  TELEBIRR_B2C_SHORTCODE: "553559"
  TELEBIRR_USSD_MERCHANT_SHORTCODE: "553559"

  # H5 / SuperApp (Fabric) async payment notification.
  #
  # This was set in .env but never in the ConfigMap, so the deployed pod ran
  # with it empty and every InApp order was created with notify_url: "". With
  # nowhere to push the result, a payment only completed while the client was
  # still polling -- the frontend gives up after 90s (POLL_TIMEOUT_MS). Pay,
  # then background the app or lose signal, and the money moved while the
  # order stayed pending with nothing left to correct it.
  #
  # A PUBLIC address, unlike the USSD and B2C URLs above. Those callbacks come
  # from Telebirr's SOAP gateway over the IPsec link, so they use 10.0.0.93.
  # H5 notifications originate from superapp.ethiomobilemoney.et over the open
  # internet, which cannot reach a VPN address. api.uat.flipstar.et resolves
  # publicly and serves a valid certificate -- verified reachable, 200 on
  # /health/ -- so it is the right host here and a bare IP is not: Telebirr
  # validates TLS, and the cert does not cover 196.189.236.140.
  TELEBIRR_NOTIFY_URL: "https://api.uat.flipstar.et/api/v1/wallet/telebirr-callback/"
  TELEBIRR_REDIRECT_URL: "https://uat.flipstar.et/wallet"

  DB_HOST: "postgres.flipstar-staging.svc.cluster.local"
  REDIS_HOST: "redis.flipstar-staging.svc.cluster.local"
  # The API's own origin plus the local dev servers a frontend runs on.
  # Without the localhost entries, every request from a developer machine
  # fails CORS -- and the browser reports it as an opaque network error,
  # while Postman succeeds because it ignores CORS entirely. Add the
  # deployed frontend origin here too once it has one.
  # The API origin plus the local dev servers a frontend runs on.
  # Without the localhost entries every browser request from a
  # developer machine fails CORS -- reported as an opaque network
  # error, and invisible in Postman, which ignores CORS entirely.
  CORS_ALLOWED_ORIGINS: "https://api.uat.flipstar.et,https://uat.flipstar.et,https://www.uat.flipstar.et,https://flipstar.et,http://localhost:3000,http://localhost:5173,http://localhost:5174"
  CSRF_TRUSTED_ORIGINS: "https://api.uat.flipstar.et,https://uat.flipstar.et,https://flipstar.et,http://localhost:3000,http://localhost:5173,http://localhost:5174"
  BACKEND_URL: "https://api.uat.flipstar.et"
  LOG_LEVEL: "DEBUG"
  # Serves /api/v1/crypto/test/* so the encrypted endpoints can be driven
  # from Postman without a crypto-capable client. STAGING ONLY -- these do
  # the client half of the exchange server-side and hand out a private key,
  # which defeats the end-to-end property entirely. Absent from the
  # production overlay on purpose; the setting defaults to False.
  CRYPTO_TEST_ENDPOINTS_ENABLED: "true"
  VAULT_ADDR: "http://vault.flipstar-staging.svc.cluster.local:8200"
  VAULT_SECRET_PATH: "flipstar/backend/staging"

  # --- TIMWE Master Aggregator integration ---
  #
  # Enable the integration so syncOrderRelation events actually apply
  # subscriptions rather than being recorded in observation mode. Without
  # this flag every hit from TIMWE is received and answered 0 (success) but
  # NO subscription is created, NO coin gift is granted, and NO SMS is sent.
  # The flag defaults to False in code (api/views/timwe.py:197) so the pod
  # silently no-ops every inbound event unless this is explicitly "true".
  TIMWE_INTEGRATION_ENABLED: "true"

  # IP allowlist for the TIMWE Master Aggregator. The MA reaches us over the
  # IPsec tunnel from 10.175.206.0/24 (same subnet as the SMPP gateway at
  # 10.175.206.42). Leave blank to accept from any IP with a warning -- set
  # this to the MA's exact egress IP(s) once TIMWE confirms them. If you
  # have seen requests arrive from partner-webserver679.phinfra.local (already
  # in ALLOWED_HOSTS), add that IP here too.
  # Example: TIMWE_ALLOWED_IPS: "10.175.206.1,10.175.206.2"
  TIMWE_ALLOWED_IPS: ""

  # Buying coins with airtime. STAGING ONLY.
  #
  # Off by default in code (config/settings/base.py) and deliberately so: the
  # policy was that Ethio Telecom SIM cards are used solely for SMS OTP
  # verification, and charging airtime for coins reverses that. Production
  # inherits the default and stays off until somebody decides otherwise --
  # which is why this lives here, in the staging overlay, and not in
  # k8s/base.
  #
  # The flag alone does not make the feature work: the charging credentials
  # (TIMWE_CHARGE_URL, TIMWE_SP_ID, TIMWE_SP_PASSWORD, TIMWE_SERVICE_ID,
  # TIMWE_CURRENCY) come from Vault, and TIMWE_CHARGING_ENABLED must be on.
  # api/services/airtime_purchase.py requires all of it before /wallet/config/
  # advertises airtime to the app, so a half-configured environment shows no
  # Airtime button rather than one that answers 403.
  TIMWE_AIRTIME_PURCHASE_ENABLED: "true"

  # The master switch on chargeAmount. STAGING ONLY.
  #
  # While this is off nothing is sent to the MA by anyone, so the airtime flag
  # above has no effect on its own -- /wallet/config/ keeps reporting
  # allows_airtime false and the Buy Coins page keeps hiding the button. Both
  # are needed, which is why they are turned on together.
  #
  # This does NOT start charging subscription renewals. That flow needs this
  # AND TIMWE_SUBSCRIPTION_RENEWAL_ENABLED, which stays off (see
  # api/services/subscription_renewal.py:125) until TIMWE confirm that
  # renewals on this service are ours to charge rather than theirs -- charging
  # from here while TIMWE also renew would bill a subscriber twice.
  #
  # Production inherits the default False from config/settings/base.py.
  TIMWE_CHARGING_ENABLED: "true"

  # Deep link base URL embedded in the welcome SMS. A subscriber who gets
  # this URL taps it to open the app / register. Must match what the mobile
  # team has registered. Defaults to https://uat.flipstar.et/register in code.
  TIMWE_SUBSCRIPTION_LINK_BASE: "https://flipstar.et/register"

  # The web app's own address, used by every SMS that offers a way in.
  #
  # Separate from BACKEND_URL, which stays on api.uat.flipstar.et: the SPA
  # calls the API cross-origin, which is why flipstar.et is in both
  # CORS_ALLOWED_ORIGINS and CSRF_TRUSTED_ORIGINS above.
  WEB_APP_BASE_URL: "https://flipstar.et"
