# Strategic-merge patch onto k8s/base/configmap.yaml -- only the keys that
# differ for staging.
#
# DB_HOST/REDIS_HOST/VAULT_ADDR are the in-cluster Services deployed on the
# sky-staging-server k3s node (namespace flipstar-staging), verified reachable
# from a pod there. VAULT_ADDR is http, not https: the staging Vault listener
# runs with tls_disable = 1. Production must not copy that -- it needs a real
# TLS listener and an https:// address here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flipstar-backend-config
data:
  # 172.16.170.2 is this node's address on the IPsec tunnel to TIMWE
  # (enp4s5). Their Master Aggregator POSTs to https://172.16.170.2/... so the
  # Host header is that bare IP; without it here Django answers 400
  # DisallowedHost after the ingress has already routed correctly, which looks
  # like an application fault rather than a config gap.
  ALLOWED_HOSTS: "api.uat.flipstar.et,uat.flipstar.et,172.16.170.2"

  # The pod CIDR, so X-Forwarded-For from ingress-nginx is honoured.
  # common/security/client_ip.py only trusts that header when the immediate
  # peer is a proxy we control, and it defaults to loopback only -- which is
  # never true in Kubernetes, where the peer is the ingress pod on 10.42.x.x.
  # Left unset, get_client_ip() returns the ingress pod's own address, so
  # TIMWE_ALLOWED_IPS would reject every genuine request from the MA, and
  # IP-based rate limiting and audit logging would attribute all traffic to
  # one internal address.
  TRUSTED_PROXY_IPS: "10.42.0.0/16"

  # Telebirr calls this back when a USSD subscription payment completes.
  #
  # It was unset, and telebirr/direct_debit.py falls back
  #   result_url or TELEBIRR_USSD_RESULT_URL or TELEBIRR_RESULT_URL
  # so every subscription payment was handed the COIN PURCHASE callback URL.
  # That handler looks up a CoinTransaction by conversation id, finds none for
  # a subscription, and drops it -- leaving the plan pending forever. The
  # status endpoint only reads the local row, so nothing self-heals: 8 of 8
  # telebirr subscriptions were stuck pending, with the customer already
  # charged.
  #
  # Host and port mirror TELEBIRR_USSD_RESULT_URL, which is the one callback
  # Telebirr is known to reach; only the path differs.
  #
  # Lives here rather than in Vault because it is a URL, not a secret, and
  # VAULT_PRECEDENCE defaults to 'env' so this value wins either way.
  # Both callbacks moved off http://uat.flipstar.et:6082 onto the ingress.
  #
  # Nothing has listened on 6082 since the namespace rebuild: `ss -lntp` shows
  # no process, no NodePort maps to it, and no Telebirr USSD payment -- coin or
  # subscription -- has confirmed since Aug 29 22:37, the last success before
  # the rebuild. 29 subscriptions and 25 coin purchases are stuck pending
  # because the confirmations have nowhere to land.
  #
  # api.uat.flipstar.et:443 is the ingress every other request already uses, so
  # it is reachable and survives cluster rebuilds. The open question is whether
  # Telebirr's client accepts our TLS certificate, which is still the
  # Kubernetes default -- if it refuses, that is why plain HTTP on a custom
  # port was chosen originally, and the certificate becomes a payment blocker.
  # Telebirr's registered callback form: plain HTTP on port 6082, unversioned
  # /api/webhooks/ path. Their July capture shows this shape working
  # (Host: api.skykin.et:6082 -> 200 OK), so it matches what their side expects.
  #
  # NOTE: nothing currently listens on 6082 -- `ss -lntp` shows no process and
  # no NodePort maps to it, which is why no callback has landed since the
  # cluster was rebuilt on 29 Aug. The URL being correct is necessary but not
  # sufficient: a listener has to be restored on that port, or Telebirr has to
  # be repointed at 443.
  TELEBIRR_USSD_RESULT_URL: "http://uat.flipstar.et:6082/api/webhooks/telebirrUssdPurchase/"
  TELEBIRR_SUBSCRIPTION_USSD_RESULT_URL: "http://uat.flipstar.et:6082/api/webhooks/telebirrSubscriptionUssd/"
  DB_HOST: "postgres.flipstar-staging.svc.cluster.local"
  REDIS_HOST: "redis.flipstar-staging.svc.cluster.local"
  # The API's own origin plus the local dev servers a frontend runs on.
  # Without the localhost entries, every request from a developer machine
  # fails CORS -- and the browser reports it as an opaque network error,
  # while Postman succeeds because it ignores CORS entirely. Add the
  # deployed frontend origin here too once it has one.
  # The API origin plus the local dev servers a frontend runs on.
  # Without the localhost entries every browser request from a
  # developer machine fails CORS -- reported as an opaque network
  # error, and invisible in Postman, which ignores CORS entirely.
  CORS_ALLOWED_ORIGINS: "https://api.uat.flipstar.et,https://uat.flipstar.et,https://www.uat.flipstar.et,http://localhost:3000,http://localhost:5173,http://localhost:5174"
  CSRF_TRUSTED_ORIGINS: "https://api.uat.flipstar.et,https://uat.flipstar.et,http://localhost:3000,http://localhost:5173,http://localhost:5174"
  BACKEND_URL: "https://api.uat.flipstar.et"
  LOG_LEVEL: "DEBUG"
  # Serves /api/v1/crypto/test/* so the encrypted endpoints can be driven
  # from Postman without a crypto-capable client. STAGING ONLY -- these do
  # the client half of the exchange server-side and hand out a private key,
  # which defeats the end-to-end property entirely. Absent from the
  # production overlay on purpose; the setting defaults to False.
  CRYPTO_TEST_ENDPOINTS_ENABLED: "true"
  VAULT_ADDR: "http://vault.flipstar-staging.svc.cluster.local:8200"
  VAULT_SECRET_PATH: "flipstar/backend/staging"
