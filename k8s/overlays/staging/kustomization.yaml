apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flipstar-staging

# namespace.yaml deliberately REMOVED from this list -- it now lives in
# k8s/infra/staging/ and is owned by the flipstar-infra-staging Application.
#
# This Application carries resources-finalizer.argocd.argoproj.io, so deleting
# it cascades. While it owned the Namespace, that cascade deleted the namespace
# and the API server then garbage-collected every object inside it, PVCs
# included -- which is how the staging database and the whole Vault were lost.
# Nothing here may own the Namespace again.
resources:
- ../../base
- ../../base/web
- ingress.yaml

labels:
- includeSelectors: true
  pairs:
    environment: staging

patches:
- path: patches/configmap-patch.yaml
- path: patches/replicas-patch.yaml
- path: patches/pdb-patch.yaml
  target:
    group: policy
    kind: PodDisruptionBudget
    name: flipstar-backend
    version: v1
- path: patches/pdb-patch.yaml
  target:
    group: policy
    kind: PodDisruptionBudget
    name: flipstar-celery-worker
    version: v1

# CI updates these two lines via `kustomize edit set image` after each
# successful build on the branch mapped to staging -- see
# .github/workflows/backend-ci-cd.yml. The tag is always a commit SHA, never
# `latest`. Argo CD's staging Application (argocd/application-staging.yaml)
# watches this file and syncs automatically on change.
# Updated by the web app's own workflow (.github/workflows/web-ci-cd.yml in
# Ammen1/flipstar-web), which pushes to this repo with a PAT because the two
# live in different repositories. Same rule as above: the tag is always a
# commit SHA, never `latest`.
images:
- name: ghcr.io/ammen1/flip-star-backend
  newName: ghcr.io/ammen1/flip-star-backend
  newTag: d085eba23542a17523f8b0a5a5550b1da9175a11
- name: ghcr.io/ammen1/flip-star-backend-celery
  newName: ghcr.io/ammen1/flip-star-backend-celery
  newTag: d085eba23542a17523f8b0a5a5550b1da9175a11
- name: ghcr.io/ammen1/flipstar-web
  newName: ghcr.io/ammen1/flipstar-web
  newTag: 7329e142700078bba44ce0d5fa706da9c45ca628
