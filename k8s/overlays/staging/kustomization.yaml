apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flipstar-staging

resources:
- namespace.yaml
- ../../base
- ingress.yaml

labels:
- includeSelectors: true
  pairs:
    environment: staging

patches:
- path: patches/configmap-patch.yaml
- path: patches/replicas-patch.yaml
- path: patches/pdb-patch.yaml
  target:
    group: policy
    kind: PodDisruptionBudget
    name: flipstar-backend
    version: v1
- path: patches/pdb-patch.yaml
  target:
    group: policy
    kind: PodDisruptionBudget
    name: flipstar-celery-worker
    version: v1

# CI updates these two lines via `kustomize edit set image` after each
# successful build on the branch mapped to staging -- see
# .github/workflows/backend-ci-cd.yml. The tag is always a commit SHA, never
# `latest`. Argo CD's staging Application (argocd/application-staging.yaml)
# watches this file and syncs automatically on change.
images:
- name: ghcr.io/ammen1/flip-star-backend
  newName: ghcr.io/ammen1/flip-star-backend
  newTag: 3a89f6a4d0161a5d0fd67ace228899967d57f21b
- name: ghcr.io/ammen1/flip-star-backend-celery
  newName: ghcr.io/ammen1/flip-star-backend-celery
  newTag: 3a89f6a4d0161a5d0fd67ace228899967d57f21b
