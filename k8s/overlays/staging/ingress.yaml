# Host split for staging:
#
#   api.uat.flipstar.et -> flipstar-backend  (Django/Daphne API)
#   uat.flipstar.et     -> flipstar-web      (React SPA)
#   flipstar.et         -> flipstar-backend  (unchanged)
#
# The SPA calls the API cross-origin, from https://uat.flipstar.et to
# https://api.uat.flipstar.et. That already works without a CORS change:
# patches/configmap-patch.yaml lists https://uat.flipstar.et in both
# CORS_ALLOWED_ORIGINS and CSRF_TRUSTED_ORIGINS.
#
# COMMIT THIS FILE SEPARATELY, AFTER the web image exists in GHCR and the web
# pods are Ready. Flipping the rule while the Deployment is in
# ImagePullBackOff turns uat.flipstar.et into a 504 -- Argo CD syncs the whole
# overlay at once, so a single commit containing both the new Deployment and
# this change would do exactly that.
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: flipstar-backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - api.uat.flipstar.et
        - uat.flipstar.et
        - flipstar.et
      secretName: flipstar-staging-tls

  rules:
    # Host-less rule: matches any Host header no other rule claims, which is
    # how TIMWE's Master Aggregator reaches us. It POSTs to
    # https://172.16.170.2/api/v1/timwe/sync-order-relation over the IPsec
    # tunnel, so the Host header is a bare IP -- and the Ingress spec forbids
    # IP addresses in `host`, so it cannot be matched by name.
    #
    # Scoped to /api/v1/timwe deliberately. A host-less `path: /` would send
    # every unmatched Host to the backend, turning this into an accidental
    # default vhost. Without the trailing slash so both
    # .../sync-order-relation and .../sync-order-relation/ match -- the MA is
    # configured without it.
    - http:
        paths:
          - path: /api/v1/timwe
            pathType: Prefix
            backend:
              service:
                name: flipstar-backend
                port:
                  name: http
          # Telebirr payment callbacks. They arrive from the private link
          # (their gateway is 10.180.70.177) addressed to this node's own IP,
          # 10.0.0.93 -- so the Host header is a bare IP and no named rule can
          # match it. Without these paths the ingress answered 404 and every
          # payment confirmation was lost, leaving subscriptions pending and
          # coin purchases uncredited since the cluster rebuild.
          #
          # Both mounts listed: Telebirr has the unversioned form mapped, and
          # config/urls.py serves the API at /api/ as well as /api/v1/.
          - path: /api/webhooks
            pathType: Prefix
            backend:
              service:
                name: flipstar-backend
                port:
                  name: http
          - path: /api/v1/webhooks
            pathType: Prefix
            backend:
              service:
                name: flipstar-backend
                port:
                  name: http
    - host: api.uat.flipstar.et
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flipstar-backend
                port:
                  name: http
    - host: uat.flipstar.et
      http:
        paths:
          # Telebirr's registered Result Address is
          # http://uat.flipstar.et:6082/api/webhooks/telebirrUssdPurchase --
          # this hostname, not api.uat.flipstar.et. The host-less rule above
          # cannot serve it: that one only matches Hosts no named rule claims,
          # and this is a named rule, so `path: /` below swallowed the callback
          # and handed it to the SPA's static nginx, which answers 405 to any
          # POST. Listed before `/` for readability only -- nginx-ingress
          # matches the longest prefix regardless of order.
          - path: /api/webhooks
            pathType: Prefix
            backend:
              service:
                name: flipstar-backend
                port:
                  name: http
          - path: /api/v1/webhooks
            pathType: Prefix
            backend:
              service:
                name: flipstar-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                # Changed from flipstar-backend. The SPA is served here; the
                # API keeps its own hostname above.
                name: flipstar-web
                port:
                  name: http
    - host: flipstar.et
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flipstar-backend
                port:
                  name: http
