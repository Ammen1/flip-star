# WHO MAY OPEN THE DASHBOARD -- the one value to edit.
#
# Comma-separated IPs/CIDRs of the staff networks (office egress address, VPN
# exit), in the form "203.0.113.20/32,198.51.100.0/29" (those two are
# documentation ranges, not real networks). kustomization.yaml copies it
# into both allow-list annotations on dashboard-ingress.yaml, so the two can
# never disagree. Not a secret, so it lives in Git like every other host and
# address in this overlay -- but it is the whole network boundary, so review
# every change to it as you would a firewall rule.
#
# The value below is RFC 5737 documentation space and matches no real client:
# until it is replaced, everyone gets 403 from the ingress. That is the
# intended default. An allow-list that starts empty starts open.
#
# NEVER add the node or pod networks (10.0.0.0/8, 10.42.0.0/16, 10.0.0.93).
# If ingress-nginx sees those addresses instead of real clients (SNAT in
# front of it), every visitor appears to come from them and the allow-list
# would admit the whole internet. Verify client addresses first -- see
# docs/private-dashboard.md, "Before the first deploy".
#
# local-config: read by kustomize for the replacement, never sent to the
# cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-access
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  allowedSourceRanges: "192.0.2.1/32"
