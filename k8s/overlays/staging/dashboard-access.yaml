# WHO MAY OPEN THE DASHBOARD -- the one value to edit.
#
# Staff reach the dashboard over Tailscale, not the public internet. The node
# advertises 10.0.0.93/32 (the ingress load-balancer address) as a subnet
# route with SNAT off, so ingress-nginx sees each device's own tailnet
# address -- stable per device, unlike the staff's dynamic ISP addresses, and
# meaningless outside the tailnet, so publishing it here gives nothing away.
# Each staff device also needs:  10.0.0.93  dashboard.flipstar.et  in its
# hosts file; over the public internet it gets 403. See
# docs/private-dashboard.md, "Staff access over Tailscale".
#
# Comma-separated /32s, one per device. kustomization.yaml copies the value
# into both allow-list annotations on dashboard-ingress.yaml, so they can
# never disagree.
#
# NEVER add the node or pod networks (10.0.0.0/8, 10.42.0.0/16, 10.0.0.93), or
# the whole tailnet range 100.64.0.0/10. tests/unit/test_private_dashboard_manifests.py
# rejects internal and over-wide networks.
#
# local-config: read by kustomize for the replacement, never sent to the
# cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-access
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  allowedSourceRanges: "100.90.215.41/32"
