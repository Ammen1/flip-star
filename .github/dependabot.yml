version: 2

updates:
  # Python dependencies pinned in requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      # Security patches land individually and fast; everything else can
      # wait and be reviewed together instead of as 20 separate PRs.
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions -- every action in .github/workflows and
  # .github/actions is pinned to a commit SHA (see backend-ci-cd.yml's
  # header comment for why), so this is what actually keeps those pins
  # current instead of silently going stale forever.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, ci]

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  # Base images in both Dockerfiles (python:3.11-slim currently).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
