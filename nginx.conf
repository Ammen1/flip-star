events { worker_connections 1024; }


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name api.uat.flipstar.et;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.uat.flipstar.et;

        ssl_certificate     /etc/letsencrypt/live/api.uat.flipstar.et/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.uat.flipstar.et/privkey.pem;

        # Standard SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Static and Media files
        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        # Django Backend
        location /api/ {
            client_max_body_size 100M;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets (Django Channels). Needs its own location because
        # plain proxy_pass doesn't forward the Upgrade/Connection handshake
        # headers on its own -- without this block, WebSocket connections
        # reach backend as ordinary HTTP requests and never upgrade.
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Everything else (including /admin/) -- backend only, no in-cluster
        # frontend. The React web client deploys separately (Vercel).
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
