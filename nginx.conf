events { worker_connections 1024; }


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Byte-serving video efficiently. sendfile hands the file to the kernel
    # rather than copying it through nginx; tcp_nopush batches the headers with
    # the first block; tcp_nodelay keeps the small follow-up range responses a
    # seeking player makes from waiting on Nagle.
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # A phone on a weak signal takes its time reading a range; don't cut it off.
    send_timeout    120s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name api.uat.flipstar.et;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.uat.flipstar.et;

        ssl_certificate     /etc/letsencrypt/live/api.uat.flipstar.et/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.uat.flipstar.et/privkey.pem;

        # Standard SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Static and Media files
        location /static/ {
            alias /app/staticfiles/;
        }

        # Public media. nginx answers Range requests itself (206 with
        # Content-Range), so video seeking works without Django in the path.
        location /media/ {
            alias /app/media/;

            # Uploaded filenames carry a unique suffix, so the bytes behind a
            # URL never change.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Accept-Ranges bytes always;
        }

        # Access-controlled media. Django authorises the request and answers
        # with X-Accel-Redirect pointing here; nginx then serves the file and
        # handles Range, so no video bytes pass through a Python worker.
        #
        # Off unless the backend sets MEDIA_INTERNAL_LOCATION=/protected-media/
        # -- without it Django streams the file itself, which is correct but
        # occupies a worker for the length of the response.
        location /protected-media/ {
            internal;
            alias /app/media/;

            add_header Cache-Control "private, max-age=3600" always;
            add_header Accept-Ranges bytes always;
        }

        # Django Backend
        location /api/ {
            client_max_body_size 100M;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets (Django Channels). Needs its own location because
        # plain proxy_pass doesn't forward the Upgrade/Connection handshake
        # headers on its own -- without this block, WebSocket connections
        # reach backend as ordinary HTTP requests and never upgrade.
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Everything else (including /admin/) -- backend only, no in-cluster
        # frontend. The React web client deploys separately (Vercel).
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
