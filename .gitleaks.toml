# gitleaks configuration for the blocking `secret-scan` CI job.
#
# The gate's purpose (see .github/workflows/backend-ci-cd.yml) is that nothing
# NEW slips in. It is deliberately NOT a clean-slate assertion: real secrets
# were committed to this repository in the past and are recoverable from git
# history regardless of what this file says. Every one of them is listed under
# "ROTATION REQUIRED" in k8s/README.md and must be treated as compromised.
#
# Without the allowlist below the job reports 28 findings and fails on every
# run, which makes a blocking gate useless -- the same trap the ruff gate in
# that workflow already documents. Each entry here is narrow, path-scoped, and
# justified. Anything not listed still fails the build.

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# False positives
# ---------------------------------------------------------------------------

[[rules]]
id = "placeholder-noop"
description = "unused; present so the [[rules]] table exists for tooling"
regex = '''__gitleaks_never_matches__'''
keywords = ["__gitleaks_never_matches__"]

[allowlist]
description = "Verified false positives and known pre-existing findings pending rotation."

paths = [
  # Documentation examples. Verified by reading: a truncated specimen JWT
  # ("eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...") and the literal string
  # "abcdef1234567890". Neither is a credential.
  '''SECURITY_DOCUMENTATION\.md$''',

  # Deliberately fake fixtures for test_sensitive_values_are_redacted, whose
  # entire purpose is asserting that strings shaped like credentials get
  # redacted from logs ("password=hunter2", "application_key: UPJG5ZM3X6C9").
  # Removing them would delete the test's inputs.
  '''tests/unit/test_settings_and_config\.py$''',

  # KNOWN PRE-EXISTING, NOT A FALSE POSITIVE.
  # These two files hardcode four real 32-character Onevas application keys.
  # One is byte-identical to the ONEVAS_APPLICATION_KEY that leaked via the
  # committed .env. They are allowlisted only so the gate stays useful; all
  # four are on the ROTATION REQUIRED list and the owning team should move
  # them into Vault. Re-check this entry once that is done and delete it.
  '''api/migrations/0057_create_subscription_tiers\.py$''',
  '''scripts/populate_subscription_tiers\.py$''',

]

regexes = [
  # Django migration dependency names, e.g. the tuple
  #     dependencies = [('api', '0108_campaign_engagement_weights')]
  # gitleaks' generic-api-key rule sees the word 'api' beside a long
  # alphanumeric string and reports the migration name as the secret.
  # Verified by running the scanner locally: the captured value is exactly
  # '0108_campaign_engagement_weights'.
  #
  # Matched by SHAPE, not by file path. A path entry for migration 0103 used
  # to sit above; it fixed one file and left the next to fail -- which is what
  # happened
  # when 0109 and 0110 were added. Every migration whose parent has a long
  # enough name trips the same rule, so this covers all of them, including ones
  # not written yet. That path entry was verified redundant against this regex
  # and removed -- it exempted a whole file, so a real key added to migration
  # 0103 later would never have been caught.
  #
  # It stays narrow: only a four-digit number, an underscore, then lowercase
  # letters, digits and underscores to the end. A credential of that exact
  # shape is implausible. Crucially this is a VALUE allowlist, not a path
  # exemption -- a real key sitting elsewhere in a migration file still
  # fails the build.
  '''^[0-9]{4}_[a-z0-9_]+$''',

  # `VAULT_TOKEN=` is empty in .env.example, so gitleaks' generic-api-key rule
  # runs past the blank line and captures the NEXT assignment as the "secret".
  # The captured value is literally `VAULT_KV_MOUNT=secret` -- Vault's default
  # KV mount name, matched only because the word "secret" is in it. Confirmed
  # by reading the reported Secret field directly, not assumed.
  '''^VAULT_KV_MOUNT=secret$''',
]
