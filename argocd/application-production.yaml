# Manual sync, deliberately: this is the payments-adjacent backend (wallet,
# Telebirr direct debit, coin transactions). "Use automated sync only where
# appropriate" -- appropriate here means a human explicitly promotes
# (backend-promote-production.yml) AND a human explicitly syncs
# (`argocd app sync flipstar-backend-production` or the UI button) before
# anything actually rolls out. Two separate deliberate actions, not one
# push. selfHeal stays on even without automated sync -- it only reverts
# drift from what's already committed, it doesn't pull in new commits, so
# it doesn't defeat the manual gate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flipstar-backend-production
  namespace: argocd
  annotations:
    # Renders as a link icon on the application node in the resource
    # tree, so the CI run that produced this revision is one click away.
    # Argo CD has no visibility into GitHub Actions itself -- build,
    # scan, sign and push all happen before it is involved -- so a link
    # is the only way to join the two halves of the pipeline.
    link.argocd.argoproj.io/external-link: https://github.com/Ammen1/flip-star/actions/workflows/backend-ci-cd.yml
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: flipstar-backend

  # Shown in the application summary panel. Static pointers at the parts
  # of the pipeline Argo CD cannot see: the build, the scan/signature and
  # the registry the image came from.
  info:
    - name: Source repository
      value: https://github.com/Ammen1/flip-star
    - name: CI pipeline (build, Trivy, cosign, GHCR push)
      value: https://github.com/Ammen1/flip-star/actions/workflows/backend-ci-cd.yml
    - name: Container images
      value: https://github.com/Ammen1?tab=packages
    - name: Manifests for this environment
      value: https://github.com/Ammen1/flip-star/tree/main/k8s/overlays/production
    - name: Runbook
      value: https://github.com/Ammen1/flip-star/blob/main/k8s/README.md

  source:
    repoURL: https://github.com/Ammen1/flip-star.git
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: flipstar-production

  syncPolicy:
    # No `automated:` block -- this is what makes sync manual. A diff shows
    # up in the Argo CD UI/CLI as OutOfSync as soon as
    # backend-promote-production.yml commits, but nothing rolls out until
    # someone runs `argocd app sync flipstar-backend-production`.
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # The HPA (production only) writes back the replica count it computed --
    # don't have every sync fight it back to the static base value.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
      name: flipstar-backend

  revisionHistoryLimit: 10
