# Automated: staging is where every push to main lands automatically (see
# .github/workflows/backend-ci-cd.yml's update-gitops-staging job) -- that's
# the point of it. prune + selfHeal make Argo CD the actual source of truth:
# prune removes resources deleted from k8s/overlays/staging, selfHeal reverts
# any manual `kubectl edit` back to what's in git within its poll interval,
# so the cluster can never silently drift from what's committed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flipstar-backend-staging
  namespace: argocd
  annotations:
    # Renders as a link icon on the application node in the resource
    # tree, so the CI run that produced this revision is one click away.
    # Argo CD has no visibility into GitHub Actions itself -- build,
    # scan, sign and push all happen before it is involved -- so a link
    # is the only way to join the two halves of the pipeline.
    link.argocd.argoproj.io/external-link: https://github.com/Ammen1/flip-star/actions/workflows/backend-ci-cd.yml
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: flipstar-backend

  # Shown in the application summary panel. Static pointers at the parts
  # of the pipeline Argo CD cannot see: the build, the scan/signature and
  # the registry the image came from.
  info:
    - name: Source repository
      value: https://github.com/Ammen1/flip-star
    - name: CI pipeline (build, Trivy, cosign, GHCR push)
      value: https://github.com/Ammen1/flip-star/actions/workflows/backend-ci-cd.yml
    - name: Container images
      value: https://github.com/Ammen1?tab=packages
    - name: Manifests for this environment
      value: https://github.com/Ammen1/flip-star/tree/main/k8s/overlays/staging
    - name: Runbook
      value: https://github.com/Ammen1/flip-star/blob/main/k8s/README.md

  source:
    # SSH, with a read-only deploy key held in the repo-flipstar-ssh
    # secret. The previous HTTPS token expired on 2026-09-21 and Argo CD
    # stopped being able to read this repo at all -- no deploy since, and
    # nothing said so except a ComparisonError nobody was watching.
    repoURL: git@github.com:Ammen1/flip-star.git
    targetRevision: main
    path: k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: flipstar-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # namespace.yaml in the overlay creates it explicitly
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
